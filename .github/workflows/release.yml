name: build

# Every push / PR: build + parsing tests. Pushing a v* tag also publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        shell: pwsh
        run: ./Package.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-ci.{0}', github.run_number) }}"

      - name: Parsing tests (shim dry run)
        shell: pwsh
        run: ./Test.ps1 -Suite Parsing

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          ## Install

          **One line** (PowerShell, asks for admin rights):
          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1 | iex
          \`\`\`
          With options: \`& ([scriptblock]::Create((irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1))) -Editor VSCode\`

          **Setup exe**: download **NotepadRedirect-Setup.exe** and run it (menu), or
          \`NotepadRedirect-Setup.exe --quiet --editor VSCode\` for unattended installs. \`--uninstall\` removes it.

          The exe is not code-signed: SmartScreen may warn ("More info" → "Run anyway"). Verify with SHA256SUMS.txt.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --generate-notes
